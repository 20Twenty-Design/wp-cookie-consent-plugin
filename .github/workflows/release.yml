name: Release

# Push a tag like v1.2.3 (created by `npm version`) to:
#   1. build + test,
#   2. publish a GitHub release with 20twenty-cookie-consent.zip — WordPress
#      sites pick it up through the plugin's built-in updater,
#   3. publish @20twenty-design/cookie-consent to GitHub Packages.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@20twenty-design"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: none

      - name: Versions match tag
        run: node scripts/verify-version.mjs "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:php
      - run: npm run package:plugin

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$VERSION" > notes.md
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" build/20twenty-cookie-consent.zip \
              --title "$GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
          else
            gh release create "$GITHUB_REF_NAME" build/20twenty-cookie-consent.zip \
              --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
          fi

      - name: Publish npm package to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
