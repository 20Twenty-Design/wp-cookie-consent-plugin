name: Release

# Push a tag like v1.2.3 (created by `npm version`) to:
#   1. build + test,
#   2. stage @twenty-twenty/cookie-consent on npmjs.com (trusted publishing:
#      OIDC, no stored npm token). A maintainer approves it on npmjs.com →
#      Staged Packages (with 2FA) before it goes live,
#   3. publish a GitHub release with 20twenty-cookie-consent.zip — WordPress
#      sites pick it up through the plugin's built-in updater.
#
# npm runs first so a publishing problem never leaves WordPress sites updated
# while the npm package is missing. The trusted publisher is stage-only, so a
# compromised workflow cannot push straight to the registry.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: none

      # Staged publishing needs npm >= 11.15.0
      - run: npm install -g npm@^11.15.0

      - name: Versions match tag
        run: node scripts/verify-version.mjs "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:php
      - run: npm run package:plugin

      - name: Stage npm package on npmjs.com (approve on npmjs.com)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            npm stage publish --tag next
          else
            npm stage publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$VERSION" > notes.md
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" build/20twenty-cookie-consent.zip \
              --title "$GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
          else
            gh release create "$GITHUB_REF_NAME" build/20twenty-cookie-consent.zip \
              --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
          fi
