name: Release

# Push a tag like v1.2.3 (created by `npm version`) to:
#   1. build + test,
#   2. publish @twenty-twenty/cookie-consent to npmjs.com (trusted
#      publishing: OIDC, no stored npm token, provenance attached),
#   3. publish a GitHub release with 20twenty-cookie-consent.zip — WordPress
#      sites pick it up through the plugin's built-in updater.
#
# npm runs first so a publishing problem never leaves WordPress sites updated
# while the npm package is missing.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: none

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1

      - name: Versions match tag
        run: node scripts/verify-version.mjs "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:php
      - run: npm run package:plugin

      - name: Publish npm package to npmjs.com
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$VERSION" > notes.md
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" build/20twenty-cookie-consent.zip \
              --title "$GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
          else
            gh release create "$GITHUB_REF_NAME" build/20twenty-cookie-consent.zip \
              --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
          fi
